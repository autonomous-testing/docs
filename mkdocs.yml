site_name: Wopee.io
site_url: !ENV [SITE_URL, "https://docs.wopee.io/"]
# repo_url enables the edit link but is deliberately not the GitHub URL: the theme would call the GitHub API on every page view for the header repo facts, which the CSS hides
repo_url: https://docs.wopee.io/
edit_uri: https://github.com/autonomous-testing/docs/edit/main/docs/
copyright: >-
  Need help? <a href="mailto:help@wopee.io">help@wopee.io</a>
  &middot; <a href="https://github.com/orgs/Wopee-io/discussions/categories/q-a">Community Q&amp;A</a>
  &middot; <a href="https://github.com/orgs/Wopee-io/discussions/categories/status-of-services">Service status</a>
  &middot; <a href="https://cmd.wopee.io">Open Commander</a>

nav:
