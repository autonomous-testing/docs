      - Playwright: playwright-visual-testing.md
      - Cypress:
          - Getting started: cypress/01-getting-started.md
          - Template project: cypress/02-template-project.md
          - Install plugin: cypress/03-install-plugin.md
      - WebdriverIO: webdriverio-visual-testing.md
      - Robot Framework:
          - Getting started: robot-framework/01-getting-started.md
          - Configuration and listener: robot-framework/02-manual-setup.md
          - Setup with make: robot-framework/03-setup-with-make.md
          - Examples: robot-framework/04-some-more-examples.md
  - MCP:
      - Overview and quick start: guides/wopee-mcp/index.md
      - Claude Code: guides/wopee-mcp/claude-code.md
      - GitHub Copilot: guides/wopee-mcp/github-copilot.md
      - Cursor: guides/wopee-mcp/cursor.md
      - OpenCode: guides/wopee-mcp/opencode.md
      - OpenAI Codex: guides/wopee-mcp/codex.md
      - Antigravity and Gemini CLI: guides/wopee-mcp/antigravity.md
      - JetBrains AI Assistant and Junie: guides/wopee-mcp/jetbrains.md
      - Devin Desktop (Windsurf): guides/wopee-mcp/devin-desktop-windsurf.md
      - Visual Studio: guides/wopee-mcp/visual-studio.md
      - Other MCP clients: guides/wopee-mcp/other-clients.md
  - CI:
      - Run in CI: ci/index.md
  - Guides:
      - Project context: guides/project-context.md
      - Upload files: guides/upload-files.md
      - Download files: guides/download-files.md
      - Browser local storage: guides/browser-local-storage.md
      - HTTP Request Tool: guides/http-tools.md
      - POM example - Login: concepts/pom-login-example.md
  - Concepts:
      - Analysis - Process: concepts/analysis-process.md
      - Analysis - Inputs: concepts/analysis-inputs.md
      - Tools & Assertions: concepts/tools-and-assertions.md
      - Self-Healing: concepts/self-healing.md
  - Reference:
      - GraphQL API: graphql-api.md
      - Glossary: glossary.md
      - Enterprise Connectivity: security/enterprise-connectivity.md

theme:
  name: material
  variant: classic
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      media: "(prefers-color-scheme: light)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Palette toggle for dark mode
    - scheme: slate
      media: "(prefers-color-scheme: dark)"
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font: false
  logo: assets/logo-yellow.png
  favicon: assets/favicon.png
  features:
    - navigation.indexes
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.prune
    - navigation.path
    - toc.follow
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link
    - search.suggest
    - search.highlight
    - search.share

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/company/wopee/
    - icon: fontawesome/brands/github
      link: https://github.com/Wopee-io

  analytics:
    provider: google
    property: G-PVTHWLV51B
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
          note: Thanks for your feedback!
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
          note: Thanks for your feedback! Write to help@wopee.io to tell us what is missing.

extra_css:
  - css/custom.css

extra_javascript:
  - js/custom.js

plugins:
  - search
  - llmstxt:
      full_output: llms-full.txt
      markdown_description: |
        Wopee.io is an AI testing platform for web apps. Its testing agents explore an app, generate plain-English and Playwright tests, run them in the cloud and report verdicts with evidence. Visual checks plug into existing Playwright, Cypress, WebdriverIO and Robot Framework tests. The Wopee.io MCP server (npm `wopee-mcp`) lets AI coding agents drive all of this from the editor.

        The web app is Commander at https://cmd.wopee.io. Project API keys and the project UUID are under More › Settings › API Keys in a project.
      sections:
        "Get started":
          - "ai-agent.md": "create a project, let the AI agent explore your app and generate tests, read the verdicts, schedule a test plan"
          - "glossary.md": "projects, baselines, branches, runs, scenarios, steps, statuses"
        "Wopee.io MCP server (AI coding agents)":
          - "guides/wopee-mcp/index.md": "quick start, configuration, environment variables, prompt library, all 15 tools and 3 prompts, how runs work, limits, security, troubleshooting, FAQ, comparison with Playwright MCP"
          - "guides/wopee-mcp/claude-code.md": "`claude mcp add`, `.mcp.json`, `${VAR}` expansion, `/mcp` (tested)"
          - "guides/wopee-mcp/github-copilot.md": "VS Code agent mode (`.vscode/mcp.json` with `servers` and `envFile`, Local session type, install link), Copilot CLI (`--additional-mcp-config` in `-p` mode), Copilot cloud agent (VS Code and Copilot CLI tested)"
          - "guides/wopee-mcp/cursor.md": "`.cursor/mcp.json` with `envFile` or `${env:VAR}`, enable in Customize › MCPs, install link, Cursor CLI (tested)"
          - "guides/wopee-mcp/opencode.md": "`opencode.json` with `mcp`, `type: local`, command array, `environment` (tested)"
          - "guides/wopee-mcp/codex.md": "`codex mcp add`, `~/.codex/config.toml`, CLI, IDE extension and ChatGPT desktop app"
          - "guides/wopee-mcp/antigravity.md": "`mcp_config.json`, `gemini mcp add`, `settings.json`"
          - "guides/wopee-mcp/jetbrains.md": "IDE settings, `.junie/mcp/mcp.json`"
          - "guides/wopee-mcp/devin-desktop-windsurf.md": "`~/.config/devin/mcp_config.json`, Devin cloud"
          - "guides/wopee-mcp/visual-studio.md": "GitHub Copilot in Visual Studio 2026 and 2022 17.14+"
          - "guides/wopee-mcp/other-clients.md": "Zed, Cline, Kilo Code, Warp, Kiro, Goose, Continue, Augment, Claude Desktop"
        "Concepts":
          - "concepts/analysis-process.md": "how Wopee.io analyzes a web app and generates tests"
          - "concepts/analysis-inputs.md": "Jira stories, Figma designs and crawl data as inputs"
          - "concepts/prompting-guidelines.md": "writing goals, scope and constraints for test generation"
          - "concepts/tools-and-assertions.md": "what the testing agent does in the browser"
          - "concepts/self-healing.md": "locators with fallback, self-troubleshooting, agent skills"
          - "concepts/pom-login-example.md": "a reusable login module"
        "Visual testing with your own tests":
          - "visual-testing.md": "projects, API keys, baselines, branches, statuses"
          - "playwright-visual-testing.md": "`@wopee-io/wopee.pw`"
          - "cypress/01-getting-started.md": "`@wopee-io/wopee.cy`"
          - "webdriverio-visual-testing.md": "`@wopee-io/wopee.wdio`"
          - "robot-framework/01-getting-started.md": "`wopee_rf`"
          - "graphql-api.md": "send screenshots from any framework"
          - "ci/index.md": "secrets, branches and suite names for any CI system"
        "Guides":
          - "guides/upload-files.md": ""
          - "guides/download-files.md": ""
          - "guides/browser-local-storage.md": ""
          - "guides/project-context.md": "global instructions for the testing agent"
          - "guides/http-tools.md": "API calls inside UI tests"
        "Optional":
          - "pilot-projects.md": ""
          - "security/enterprise-connectivity.md": "apps behind VPN or firewalls"
  - redirects:
      redirect_maps:
        "integrations/cypress/01-getting-started.md": "cypress/01-getting-started.md"
        "cypress.md": "cypress/01-getting-started.md"
        "cy.md": "cypress/01-getting-started.md"
        "integrations/playwright/01-getting-started.md": "playwright-visual-testing.md"
        "playwright.md": "playwright-visual-testing.md"
        "pw.md": "playwright-visual-testing.md"
        "integrations/webdriverio/01-getting-started.md": "webdriverio-visual-testing.md"
        "webdriverio.md": "webdriverio-visual-testing.md"
        "wdio.md": "webdriverio-visual-testing.md"
        "integrations/robot-framework/01-getting-started.md": "robot-framework/01-getting-started.md"
        "robot-framework.md": "robot-framework/01-getting-started.md"
        "rf.md": "robot-framework/01-getting-started.md"
        "getting-started.md": "ai-agent.md"
        "bot.md": "ai-agent.md"
        "mcp.md": "guides/wopee-mcp/index.md"
        "guides/wopee-mcp/windsurf.md": "guides/wopee-mcp/devin-desktop-windsurf.md"
        "guides/wopee-mcp/vscode.md": "guides/wopee-mcp/github-copilot.md"

markdown_extensions:
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  - pymdownx.superfences
  - md_in_html
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
