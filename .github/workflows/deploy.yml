name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: If repo is docs-prod replace text docs.dev.wopee.io to docs.wopee.io and remove robots.txt
        if: github.repository == 'autonomous-testing/docs-prod'
        run: |
          sed -i 's/docs.dev.wopee.io/docs.wopee.io/g' ./CNAME
          rm -rf ./docs/robots.txt

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build website
        run: |
          python scripts/check-media.py
          export SITE_URL="https://$(cat CNAME)/"
          zensical build --strict

      - name: Add nojekyll file
        run: touch ./site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "./site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
