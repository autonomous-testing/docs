<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500" role="img" aria-labelledby="t d">
  <title id="t">How a pass is checked</title>
  <desc id="d">After an agent run, evidence checks compare the claimed pass with the run record. If the evidence supports it, the run is Passed. If evidence is missing, the pass is flagged: in Report only mode it stays Passed with an amber mark and a Verdict Integrity section in the report; in Enforce mode it becomes Incomplete, or Failed if one of the run's own checks failed.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#555b6e"/>
    </marker>
  </defs>
  <style>
    text { font-family: Rubik, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #0b1020; }
    .h { font-size: 18px; font-weight: 600; }
    .s { font-size: 14px; fill: #555b6e; }
    .e { font-size: 12px; font-weight: 600; letter-spacing: .06em; fill: #555b6e; }
    .p { font-size: 14px; font-weight: 600; fill: #fff; }
    .box { fill: #f4f4f8; stroke: #d6d7e0; stroke-width: 1.5; }
    .ln { fill: none; stroke: #555b6e; stroke-width: 1.8; marker-end: url(#a); }
  </style>
  <rect x="1" y="1" width="718" height="498" rx="14" fill="#fff" stroke="#e3e3ea" stroke-width="2"/>

  <rect class="box" x="20" y="24" width="190" height="112" rx="10"/>
  <text class="h" x="38" y="56">Agent run</text>
  <text class="s" x="38" y="82">steps, checks and a</text>
  <text class="s" x="38" y="102">report that claims</text>
  <text class="s" x="38" y="122">Passed</text>

  <path class="ln" d="M210 80H242"/>

  <rect x="244" y="24" width="210" height="112" rx="10" fill="#f3ecf8" stroke="#7030a0" stroke-width="1.8"/>
  <text class="h" x="262" y="56" style="fill:#5a2283">Evidence checks</text>
  <text class="s" x="262" y="82">compare the claim with</text>
  <text class="s" x="262" y="102">what the run recorded</text>
  <text class="s" x="262" y="122">and observed</text>

  <path class="ln" d="M454 80H486"/>

  <rect x="488" y="24" width="212" height="112" rx="10" fill="#ecf8f0" stroke="#16a34a" stroke-width="1.8"/>
  <text class="e" x="506" y="52">EVIDENCE SUPPORTS IT</text>
  <rect x="506" y="66" width="76" height="28" rx="14" fill="#16a34a"/>
  <text class="p" x="544" y="85" text-anchor="middle">Passed</text>
  <text class="s" x="506" y="120">the result stands</text>

  <path class="ln" d="M349 136V170"/>

  <rect x="232" y="172" width="234" height="112" rx="10" fill="#fff7e8" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text class="e" x="250" y="200">EVIDENCE MISSING</text>
  <text class="h" x="250" y="228">Pass flagged</text>
  <text class="s" x="250" y="252">the report names the check</text>
  <text class="s" x="250" y="272">and the reason</text>

  <path class="ln" d="M349 284V306H190V330"/>
  <path class="ln" d="M349 306H530V330"/>

  <rect class="box" x="40" y="332" width="300" height="144" rx="10"/>
  <text class="e" x="60" y="360">REPORT ONLY (DEFAULT)</text>
  <rect x="60" y="374" width="76" height="28" rx="14" fill="#16a34a"/>
  <text class="p" x="98" y="393" text-anchor="middle">Passed</text>
  <text x="148" y="393" style="font-size:14px;font-weight:600;fill:#b45309">+ amber mark</text>
  <text class="s" x="60" y="430">counts stay the same; the report</text>
  <text class="s" x="60" y="450">gets a Verdict Integrity section</text>

  <rect class="box" x="380" y="332" width="300" height="144" rx="10"/>
  <text class="e" x="400" y="360">ENFORCE</text>
  <rect x="400" y="374" width="104" height="28" rx="14" fill="#d97706"/>
  <text class="p" x="452" y="393" text-anchor="middle">Incomplete</text>
  <text class="s" x="400" y="430">Failed instead if one of the</text>
  <text class="s" x="400" y="450">run's own checks failed</text>
</svg>
